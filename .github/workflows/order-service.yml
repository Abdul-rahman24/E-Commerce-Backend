name: Order Service CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'order-service/**'
      - '.github/workflows/order-service.yml'

jobs:
  continuous-integration:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./order-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13' 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run Tests & Generate Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ --cov=src --cov-report=xml:coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: order-service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 

  continuous-deployment:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: continuous-integration
    defaults:
      run:
        working-directory: ./order-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Package Lambda Deployment
        run: |
          pip install -t package -r requirements.txt
          cp -r src package/
          cd package
          zip -r ../deployment.zip .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-1

      - name: Update Lambda Code via AWS CLI
        run: |
          aws lambda update-function-code \
            --function-name Order_Service_abd \
            --zip-file fileb://deployment.zip

      - name: Wait for Lambda Code Update to Complete
        run: |
          aws lambda wait function-updated \
            --function-name Order_Service_abd
            
      - name: Update Lambda Environment Variables
        run: |
          aws lambda update-function-configuration \
            --function-name Order_Service_abd \
            --environment "Variables={CART_SERVICE_URL=https://rld8go3jd8.execute-api.ap-southeast-1.amazonaws.com/v1/cart,INVENTORY_SERVICE_URL=https://owyllwzwo5.execute-api.ap-southeast-1.amazonaws.com/v1/inventory,ORDER_EVENTS_TOPIC_ARN=arn:aws:sns:ap-southeast-1:726101441380:OrderEventsTopic_abd,ORDER_TABLE_NAME=orders_abd}"