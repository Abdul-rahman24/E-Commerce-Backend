name: Product Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'product-service/**'
      - 'terraform/**'
  pull_request:
    paths:
      - 'product-service/**'

jobs:
  build-and-test:
    name: Build, Test, and Sonar Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' 

      - name: Install Dependencies
        working-directory: ./product-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov mangum

      - name: Run Pytest and Generate Coverage Report
        working-directory: ./product-service
        env:
          INVENTORY_SERVICE_URL: "http://mock-inventory-service"
          SEARCH_SERVICE_URL: "http://mock-search-service"
        run: |
          PYTHONPATH=. pytest tests/ --cov=src --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   
        with:
          projectBaseDir: product-service
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml

  deploy:
    name: Deploy Code Update to AWS
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Package Product Service Lambda
        working-directory: ./product-service
        run: |
          pip install --target ./package -r requirements.txt mangum
          cd package
          zip -r ../payload.zip .
          cd ..
          zip -g payload.zip -r src/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-1

      - name: Update Lambda Code via AWS CLI
        run: |
          aws lambda update-function-code \
            --function-name Product_Service_abd \
            --zip-file fileb://product-service/payload.zip