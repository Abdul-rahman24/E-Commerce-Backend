name: Search Service CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'search-service/**'
      - '.github/workflows/search-service.yml'

jobs:
  continuous-integration:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./search-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run Tests & Generate Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ --cov=src --cov-report=xml:coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: search-service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 

  continuous-deployment:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: continuous-integration
    defaults:
      run:
        working-directory: ./search-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Package search Service Lambda
        working-directory: ./search-service
        run: |
          pip install --target ./package -r requirements.txt mangum
          cd package
          zip -r ../payload.zip .
          cd ..
          zip -g payload.zip -r src/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-1

      - name: Update Lambda Code via AWS CLI
        run: |
          aws lambda update-function-code \
            --function-name Search_Service_abd \
            --zip-file fileb://payload.zip

      - name: Wait for Lambda Code Update to Complete
        run: |
          aws lambda wait function-updated \
            --function-name Search_Service_abd