name: Inventory Service CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'inventory-service/**'
      - '.github/workflows/inventory-service.yml'

jobs:
  # ==========================================
  # JOB 1: Continuous Integration (Build & Test)
  # ==========================================
  continuous-integration:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./inventory-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13' 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run Tests & Generate Coverage
        run: |
          pytest tests/ --cov=src --cov-report=xml:coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: inventory-service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk Security Scan
        working-directory: ./inventory-service
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --file=requirements.txt --severity-threshold=high
          snyk monitor --file=requirements.txt

  # ==========================================
  # JOB 2: Continuous Deployment (AWS Lambda)
  # ==========================================
  continuous-deployment:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    # This line forces CD to wait for CI to finish successfully!
    needs: continuous-integration
    defaults:
      run:
        working-directory: ./inventory-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Package Lambda Deployment
        run: |
          pip install -t package -r requirements.txt
          cp -r src package/
          cd package
          zip -r ../deployment.zip .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-1

      - name: Update Lambda Code via AWS CLI
        run: |
          aws lambda update-function-code \
            --function-name Inventory_Service_abd \
            --zip-file fileb://deployment.zip

      - name: Wait for Lambda Code Update to Complete
        run: |
          aws lambda wait function-updated \
            --function-name Inventory_Service_abd

      - name: Update Lambda Environment Variables
        run: |
          aws lambda update-function-configuration \
            --function-name Inventory_Service_abd \
            --environment "Variables={PRODUCT_SERVICE_URL=https://oowum3m5c4.execute-api.ap-southeast-1.amazonaws.com/v1/products}"