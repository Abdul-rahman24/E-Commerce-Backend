# product-service/sonar-project.properties

# A unique identifier for this specific microservice in SonarCloud
sonar.projectKey=ecommerce-product-service
# Put the exact organization key from your SonarCloud account here:
sonar.organization=abdul-rahman24

sonar.python.version=3.9
sonar.sources=src
sonar.tests=tests

# Tells SonarQube where GitHub Actions will save the test coverage report
sonar.python.coverage.reportPaths=coverage.xml