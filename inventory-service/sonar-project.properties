# You must create a new project in SonarCloud UI to get this unique key
sonar.projectKey=abdul-rahman24_inventory-service
sonar.organization=abdul-rahman24

# Point SonarCloud strictly to the inventory folders
sonar.sources=src
sonar.tests=tests

# Tell SonarCloud where the coverage XML will be generated by pytest
sonar.python.coverage.reportPaths=coverage.xml